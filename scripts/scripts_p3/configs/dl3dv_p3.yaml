# Part 3 config: DL3DV-2

dataset_type: dl3dv
n_interp: 5
alpha_photo: 4.0

# Hybrid training
total_iterations: 15000
beta_max: 0.6
beta_warmup: 1500
pseudo_ratio: 0.45
